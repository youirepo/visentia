[project]
name = "visentia"
version = "0.1.0.dev0"
description = "An engine that turns a Tutor's Prompt into a narrated Manim Explainer Artifact for NSW NESA Year 7-10 math."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Visentia" }]
dependencies = [
    "manim==0.19.0",
    "manim-voiceover==0.3.7",
    "edge-tts==7.2.8",
    "google-genai==2.4.0",
    "python-dotenv==0.21.1",
    # Workaround: manim-voiceover 0.3.7 imports `pkg_resources` (removed in setuptools 80).
    "setuptools<80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
visentia = "visentia.app_shell:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that exercise the full Manim render pipeline (skip with `-m 'not slow'`)",
]
